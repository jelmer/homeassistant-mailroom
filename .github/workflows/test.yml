name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install --group dev
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: mypy custom_components/mailroom tests

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each release of the test harness pins one Home Assistant version:
        # 0.13.367 is 2026.9.4, the one pyproject.toml asks for, and
        # 0.13.368 is 2026.10.0b0.
        harness: ["0.13.367", "0.13.368"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component==${{ matrix.harness }}
      - run: pytest
