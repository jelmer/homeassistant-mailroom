# Home Assistant copies `custom_components/mailroom` into a config
# directory, so there is nothing here to build or install. This file carries
# the tool configuration and the dependencies a test run needs.

[dependency-groups]
test = [
    # Brings Home Assistant itself, pytest and the fixtures a custom
    # integration is tested against, so the Home Assistant version under test
    # comes from here rather than being pinned separately.
    "pytest-homeassistant-custom-component==0.13.367",
]
dev = [
    {include-group = "test"},
    "mypy",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true
